# https://circleci.com/docs/configuration-reference/
version: 2
jobs:
  build:
    docker:
      # https://circleci.com/developer/images/image/cimg/node
      # TODO: Pin Docker image to immutable @sha256 digest
      - image: cimg/node:24.12.0

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v24-dependencies-{{ checksum "package-lock.json" }}

      - run: npm ci --ignore-scripts

      - save_cache:
          paths:
            - node_modules
          key: v24-dependencies-{{ checksum "package-lock.json" }}

      - run: npm test
